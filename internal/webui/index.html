<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dio</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #e3e6eb; --text: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --accent-weak: #e8efff; --user: #2563eb; --danger: #c62828; --ok: #2e7d32;
    --tool: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); padding: 6px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: #fff; color: var(--text); }

  aside { width: 280px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  aside header { padding: 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  aside header h1 { font-size: 18px; margin: 0; flex: 1; }
  #sessions { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #sessions li { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  #sessions li:hover { background: var(--bg); }
  #sessions li.active { background: var(--accent-weak); }
  #sessions .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sessions .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #sessions .empty { color: var(--muted); cursor: default; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  main > header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  #title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #model-badge { color: var(--muted); font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .placeholder { margin: auto; color: var(--muted); text-align: center; line-height: 1.8; }
  .msg { max-width: 820px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; padding: 10px 14px; border-radius: 12px; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.assistant.streaming::after { content: "▍"; color: var(--accent); }
  details.reasoning { align-self: flex-start; max-width: 820px; color: var(--muted); font-size: 13px; }
  details.reasoning pre { white-space: pre-wrap; margin: 4px 0 0; font-family: inherit; }
  .tool { align-self: flex-start; max-width: 820px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--tool); border-radius: 8px; padding: 6px 10px; }
  .tool .label { font-weight: 600; margin-right: 6px; }
  .tool.ok .label { color: var(--ok); }
  .tool.err { background: #fdecea; }
  .tool.err .label { color: var(--danger); }
  .footer { align-self: flex-start; color: var(--muted); font-size: 12px; }
  .error { align-self: stretch; color: var(--danger); background: #fdecea; border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; }

  #composer { padding: 12px 20px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 200px; line-height: 1.5; }

  dialog { border: none; border-radius: 12px; padding: 0; width: 460px; max-width: 95vw; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  dialog form { padding: 20px; display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center; }
  dialog h2 { grid-column: 1 / -1; margin: 0 0 6px; font-size: 17px; }
  dialog label { color: var(--muted); }
  dialog .hint { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -6px; }
  dialog .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  #settings-error { grid-column: 1 / -1; color: var(--danger); min-height: 1em; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Dio</h1>
    <button id="new-btn" class="primary" title="开始新会话">新建会话</button>
  </header>
  <ul id="sessions"></ul>
</aside>

<main>
  <header>
    <div id="title">新会话</div>
    <div id="model-badge"></div>
    <button id="settings-btn">设置</button>
  </header>
  <div id="log"></div>
  <div id="composer">
    <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send-btn" class="primary">发送</button>
    <button id="stop-btn" class="danger" hidden>停止</button>
  </div>
</main>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>设置</h2>
    <label for="s-provider">协议</label>
    <select id="s-provider" name="provider"></select>
    <label for="s-model">模型</label>
    <input id="s-model" name="model" placeholder="例如 deepseek-flash">
    <label for="s-base">Base URL</label>
    <input id="s-base" name="base_url" placeholder="留空使用官方地址，例如 https://gateway/v1">
    <label for="s-key">API key</label>
    <input id="s-key" name="api_key" type="password" autocomplete="off">
    <div class="hint" id="key-hint"></div>
    <label for="s-root">工作目录</label>
    <input id="s-root" name="root">
    <div class="hint">read_file 只能读取这个目录下的文件（只读）</div>
    <label for="s-turns">最大轮数</label>
    <input id="s-turns" name="max_turns" type="number" min="1">
    <label for="s-tokens">最大 tokens</label>
    <input id="s-tokens" name="max_tokens" type="number" min="1">
    <label for="s-effort">推理强度</label>
    <select id="s-effort" name="reasoning_effort">
      <option value="">默认</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option>
    </select>
    <label for="s-temp">Temperature</label>
    <input id="s-temp" name="temperature" type="number" min="0" max="2" step="0.1" placeholder="留空由模型决定">
    <div id="settings-error"></div>
    <div class="actions">
      <button type="button" id="clear-key-btn" class="danger">清除 key</button>
      <button type="button" id="cancel-settings">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { config: null, current: null, running: false, abort: null };

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function fmtTime(s) {
  const d = new Date(s);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

// ---- sessions ----
async function loadSessions() {
  const list = $("sessions");
  let sessions;
  try { sessions = await api("GET", "/api/sessions"); }
  catch (e) { list.replaceChildren(el("li", "empty", "读取会话失败：" + e.message)); return; }
  list.replaceChildren();
  if (!sessions.length) { list.append(el("li", "empty", "还没有会话")); return; }
  for (const s of sessions) {
    const li = el("li");
    li.dataset.id = s.id;
    if (s.id === state.current) li.classList.add("active");
    li.append(el("div", "title", s.title || "（无标题）"));
    const tokens = s.usage.input_tokens + s.usage.output_tokens;
    li.append(el("div", "meta", `${fmtTime(s.updated_at)} · ${s.message_count} 条 · ${tokens} tokens`));
    li.append(el("div", "meta", s.id));
    li.title = `${s.provider}/${s.model}`;
    li.onclick = () => openSession(s.id);
    list.append(li);
  }
}

function showPlaceholder() {
  const p = el("div", "placeholder");
  p.append(el("div", "", "开始新的对话"));
  p.append(el("div", "", "模型可以用 read_file 读取工作目录下的文件"));
  $("log").replaceChildren(p);
}

function newSession() {
  if (state.running) return;
  state.current = null;
  history.replaceState(null, "", location.pathname);
  $("title").textContent = "新会话";
  showPlaceholder();
  loadSessions();
  $("input").focus();
}

async function openSession(id) {
  if (state.running) return;
  let s;
  try { s = await api("GET", "/api/sessions/" + encodeURIComponent(id)); }
  catch (e) { showError(e.message); return; }
  state.current = s.id;
  history.replaceState(null, "", "#session=" + s.id);
  $("title").textContent = s.title || s.id;
  $("log").replaceChildren();
  for (const item of s.items) renderItem(item);
  if (!s.items.length) showPlaceholder();
  loadSessions();
  scrollDown();
}

// ---- rendering ----
function renderItem(item) {
  const log = $("log");
  log.querySelector(".placeholder")?.remove();
  switch (item.kind) {
    case "user": log.append(el("div", "msg user", item.text)); break;
    case "assistant": log.append(el("div", "msg assistant", item.text)); break;
    case "reasoning": {
      const d = el("details", "reasoning");
      d.append(el("summary", "", "思考过程"), el("pre", "", item.text));
      log.append(d);
      break;
    }
    case "tool_call": {
      const row = el("div", "tool");
      row.append(el("span", "label", "工具"), document.createTextNode(`${item.name}(${item.args || ""})`));
      log.append(row);
      break;
    }
    case "tool_result": {
      const row = el("div", "tool " + (item.is_error ? "err" : "ok"));
      const text = item.is_error
        ? `${item.name}：${item.preview || ""}`
        : `${item.name}：${item.bytes} 字节` + (item.preview ? ` · ${item.preview}` : "");
      row.append(el("span", "label", item.is_error ? "出错" : "结果"), document.createTextNode(text));
      log.append(row);
      break;
    }
  }
}

function showError(msg) { $("log").append(el("div", "error", msg)); scrollDown(); }

function setRunning(on) {
  state.running = on;
  $("send-btn").hidden = on;
  $("stop-btn").hidden = !on;
  $("new-btn").disabled = on;
}

// ---- chat ----
async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || state.running) return;
  if (!state.config.has_api_key || !state.config.model) { openSettings("请先填写模型和 API key"); return; }

  setRunning(true);
  try {
    if (!state.current) {
      const s = await api("POST", "/api/sessions", {});
      state.current = s.id;
      history.replaceState(null, "", "#session=" + s.id);
      $("title").textContent = s.id;
    }
    input.value = "";
    renderItem({ kind: "user", text });
    scrollDown();
    await stream(state.current, text);
  } catch (e) {
    if (e.name !== "AbortError") showError(e.message);
  } finally {
    setRunning(false);
    state.abort = null;
    loadSessions();
    input.focus();
  }
}

async function stream(id, text) {
  state.abort = new AbortController();
  const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/messages`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }), signal: state.abort.signal,
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || ("HTTP " + res.status));
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", bubble = null, thinking = null;
  const log = $("log");

  const handle = (event, data) => {
    switch (event) {
      case "text":
        if (!bubble) { bubble = el("div", "msg assistant streaming", ""); log.append(bubble); }
        bubble.textContent += data.delta;
        break;
      case "reasoning":
        if (!thinking) {
          const d = el("details", "reasoning");
          thinking = el("pre", "", "");
          d.append(el("summary", "", "思考中…"), thinking);
          log.append(d);
        }
        thinking.textContent += data.delta;
        break;
      case "message_end":
      case "item":
        bubble?.classList.remove("streaming");
        if (thinking) thinking.previousSibling.textContent = "思考过程";
        bubble = null; thinking = null;
        if (event === "item") renderItem(data);
        break;
      case "done": {
        bubble?.classList.remove("streaming");
        const u = data.usage || {};
        let line = `${data.turns} 次模型调用 · 输入 ${u.input_tokens || 0} / 输出 ${u.output_tokens || 0} tokens`;
        if (u.cache_read_tokens) line += ` · 缓存命中 ${u.cache_read_tokens}`;
        log.append(el("div", "footer", line));
        if (data.error) showError(data.error);
        if (data.title) $("title").textContent = data.title;
        break;
      }
    }
    scrollDown();
  };

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) handle(event, JSON.parse(data));
    }
  }
}

async function stop() {
  if (!state.running || !state.current) return;
  try { await api("POST", `/api/sessions/${encodeURIComponent(state.current)}/cancel`, {}); }
  catch (e) { state.abort?.abort(); }
}

// ---- settings ----
async function loadConfig() {
  state.config = await api("GET", "/api/config");
  const c = state.config;
  $("model-badge").textContent = c.model ? `${c.provider} / ${c.model}` : "未设置模型";
  const sel = $("s-provider");
  sel.replaceChildren(...c.providers.map((p) => { const o = el("option", "", p); o.value = p; return o; }));
}

function openSettings(message) {
  const c = state.config;
  $("s-provider").value = c.provider;
  $("s-model").value = c.model;
  $("s-base").value = c.base_url;
  $("s-key").value = "";
  $("s-key").placeholder = c.has_api_key ? "已设置（留空保持不变）" : "未设置";
  $("key-hint").textContent = "只保存在本机 dio 进程内存中，不写入磁盘";
  $("s-root").value = c.root;
  $("s-turns").value = c.max_turns;
  $("s-tokens").value = c.max_tokens;
  $("s-effort").value = c.reasoning_effort;
  $("s-temp").value = c.temperature ?? "";
  $("settings-error").textContent = message || "";
  $("settings").showModal();
}

async function saveSettings(extra) {
  const temp = $("s-temp").value.trim();
  const body = {
    provider: $("s-provider").value, model: $("s-model").value, base_url: $("s-base").value,
    root: $("s-root").value, max_turns: Number($("s-turns").value), max_tokens: Number($("s-tokens").value),
    reasoning_effort: $("s-effort").value, temperature: temp === "" ? null : Number(temp),
    api_key: $("s-key").value, ...extra,
  };
  try {
    await api("PUT", "/api/config", body);
    await loadConfig();
    $("settings").close();
  } catch (e) {
    $("settings-error").textContent = e.message;
  }
}

// ---- wiring ----
$("new-btn").onclick = newSession;
$("send-btn").onclick = send;
$("stop-btn").onclick = stop;
$("settings-btn").onclick = () => openSettings();
$("cancel-settings").onclick = () => $("settings").close();
$("clear-key-btn").onclick = () => saveSettings({ clear_api_key: true, api_key: "" });
$("settings-form").onsubmit = (e) => { e.preventDefault(); saveSettings({}); };
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

(async function init() {
  try { await loadConfig(); } catch (e) { showError("无法连接 dio 服务：" + e.message); return; }
  const m = location.hash.match(/session=([\w-]+)/);
  if (m) await openSession(m[1]); else { showPlaceholder(); await loadSessions(); }
  if (!state.config.has_api_key || !state.config.model) openSettings("请先填写模型和 API key");
})();
</script>
</body>
</html>
